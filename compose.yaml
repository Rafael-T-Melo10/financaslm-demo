name: financaslm-portfolio-demo
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: financas_portfolio
      POSTGRES_USER: financas_portfolio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python scripts/configure_demo.py}
    volumes:
      - portfolio_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financas_portfolio -d financas_portfolio"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: ./backend
    environment:
      PORTFOLIO_DEMO: "1"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: financas_portfolio
      POSTGRES_USER: financas_portfolio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SECRET_KEY: ${SECRET_KEY:?Run python scripts/configure_demo.py}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Run python scripts/configure_demo.py}
      ENVIRONMENT: demo
      GMAIL_SYNC_ENABLED: "false"
      WHATSAPP_HABILITADO: "false"
      ASSISTENTE_HABILITADO: "false"
      ASSISTENTE_LOG_DIR: ""
      ALLOWED_ORIGINS: http://localhost:3012,http://127.0.0.1:3012
    ports:
      - "127.0.0.1:8012:8000"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && python scripts/seed_portfolio.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3012:80"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  portfolio_db:
